<html lang="pt-br">
<head>

<body>
    <p class="nome">Lucia</p>

<div class="menu">
    
        <img onclick="escolherPersonagem('Lucia','img/lucia.png','#ff3cac')" class="lucia" src="img/lucia.png">

        <label class="voce">📸
            <input type="file" accept="image/*" hidden onchange="lerfoto(this)">

        </label>
